<title>Get Matro</title>
<script>
// The link every Matro invite and share carries (INV-03): iPhones and iPads go to the App Store,
// Android to Google Play, everything else (and anyone without JavaScript) sees this page with both.
// ?stay shows the page on a phone too.
(function () {
  var ua = navigator.userAgent || "";
  var apple = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var android = /Android/i.test(ua);
  var store = apple ? "https://apps.apple.com/app/id6816677523"
    : android ? "https://play.google.com/store/apps/details?id=se.flipware.hem" : null;
  if (store && !/[?&]stay\b/.test(location.search)) location.replace(store);
})();
</script>
